tle">Sauvegarde de mon carnet</h2><div class="card"><p class="small muted">Les coches et dépenses sont enregistrées sur ce navigateur seulement. Pense à exporter une copie, surtout sur iPhone.</p><div class="btnrow">${btn('↓ Exporter la sauvegarde','export')}${btn('↑ Importer une sauvegarde','import')}</div><input id="backup-file" type="file" accept=".json,application/json" class="hide"><p class="small muted">Il manque encore l’adresse exacte de certains restaurants et les billets eux-mêmes : ils ne sont pas stockés dans ce carnet.</p></div>`}
function renderPlanning(){let aa=activities.filter(a=>a.day===state.selectedDay);$('#view-planning').innerHTML=`<h2 class="section-title">Le programme</h2>${dayButtons()}<div class="flex"><div><h3 style="font:normal 23px Georgia,serif;margin:8px 0 0">${days[state.selectedDay][0]} octobre</h3><div class="small muted">${days[state.selectedDay][1]}</div></div><span class="tag">${aa.filter(a=>state.checked[a.id]).length}/${aa.length} faits</span></div><div class="timeline">${aa.map(a=>`<article class="activity ${state.checked[a.id]?'done':''}"><div class="activity-head"><input class="check" type="checkbox" aria-label="Terminé : ${escapeHTML(a.name)}" data-check="${escapeHTML(a.id)}" ${state.checked[a.id]?'checked':''}><div class="time">${escapeHTML(a.time)}</div><div class="activity-body"><div class="aname">${escapeHTML(a.name)} ${a.status==='réservé'?'<span class="pill booked">Réservé</span>':''}</div>${a.note?`<div class="notes">${escapeHTML(a.note)}</div>`:''}${a.loc?`<div class="actions"><a href="${mapsLink(locText(a))}" target="_blank" rel="noopener">📍 Localiser ↗</a><a href="${directions(locText(a))}" target="_blank" rel="noopener">🚇 Depuis King’s Cross ↗</a></div>`:''}</div></div></article>`).join('')}</div><div class="card">${progress()}<p class="small muted">Toutes les cases sont décochées au départ. Tu peux les cocher ou les décocher librement.</p></div>`}
let mapInstance=null,markers=null,route=null;const kindColor={activite:'#198754',visite:'#198754',restaurant:'#ea6b16',musee:'#7147cf',nature:'#0e9081',pause:'#9a668e',transport:'#146fd1',pratique:'#555c66'};function mapLabel(a){return `${a.time} · ${a.name}`};function renderMap(){if(mapInstance){mapInstance.remove();mapInstance=null}let options=`<option value="all">Tout le séjour</option>${days.map((d,i)=>`<option value="${i}" ${state.mapDay===String(i)?'selected':''}>${d[0]} octobre</option>`).join('')}`;$('#view-map').innerHTML=`<h2 class="section-title">La carte de Londres</h2><p class="muted small">Explore les étapes et filtre par jour ou catégorie. L’hébergement est représenté par la gare de King’s Cross (pas son adresse exacte). Les marqueurs sont approximatifs : ouvre Google Maps pour l’emplacement exact et le trajet réel.</p><div class="grid2"><label><span class="field">Journée</span><select class="input" id="map-day">${options}</select></label><label><span class="field">Catégorie</span><select class="input" id="map-kind"><option value="all">Toutes</option>${Object.entries({visite:'Visites',activite:'Activités',restaurant:'Restaurants',musee:'Musées',nature:'Parcs & jardins',transport:'Transports',pause:'Pauses',pratique:'Pratique'}).map(([k,v])=>`<option value="${k}" ${state.mapKind===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="maplegend">${Object.entries(categoryLabels).map(([k,v])=>`<span class="legenditem"><i style="background:${kindColor[k]}"></i>${v}</span>`).join('')}</div><div class="card" style="padding:8px"><div id="map" role="region" aria-label="Carte interactive de Londres"><div class="mapfallback">Chargement de la carte…<br><small>Connexion Internet nécessaire.</small></div></div></div><p class="small muted">● Airbnb toujours visible · Les lignes montrent l’ordre des étapes, pas les véritables rues empruntées. Fond OpenStreetMap actualisé en ligne, sans garantie de mise à jour immédiate.</p><a class="btn" href="${mapsLink(AIRBNB)}" target="_blank" rel="noopener">⌂ Voir King’s Cross dans Google Maps ↗</a><h3 class="section-title">Lieux affichés</h3><div id="map-list"></div>`;mapInstance=null;setupMap()}
function setupMap(){const filtered=activities.filter(a=>(state.mapDay==='all'||a.day===Number(state.mapDay))&&(state.mapKind==='all'||a.kind===state.mapKind));const locations=filtered.filter(a=>coords[a.loc]);let dedup=new Map();for(const a of locations)if(!dedup.has(a.loc))dedup.set(a.loc,a);$('#map-list').innerHTML=[...dedup.values()].map(a=>`<div class="expense"><span><span class="mapdot" style="background:${kindColor[a.kind]||'#198754'}"></span><b>${escapeHTML(a.name)}</b><br><small class="muted">${escapeHTML(days[a.day][0])}</small></span><a class="small" href="${mapsLink(locText(a))}" target="_blank" rel="noopener">Ouvrir ↗</a></div>`).join('')||'<p class="muted">Aucun lieu pour ce filtre.</p>';if(typeof window.L==='undefined'){$('#map').innerHTML='<div class="mapfallback">Carte inaccessible pour le moment.<br>Les liens vers Google Maps restent utilisables.</div>';return}try{mapInstance=L.map('map',{scrollWheelZoom:false}).setView(coords.kings,12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributeurs'}).addTo(mapInstance);L.circleMarker(coords.airbnb,{radius:10,color:'#fff',weight:2,fillColor:'#302820',fillOpacity:1}).addTo(mapInstance).bindPopup(`<b>⌂ Quartier de l’hébergement</b><br>${escapeHTML(AIRBNB)}<br><a href="${mapsLink(AIRBNB)}" target="_blank">Itinéraire précis ↗</a>`);const bounds=[coords.airbnb];for(const [k,a]of dedup){L.circleMarker(coords[k],{radius:10,color:'#fff',weight:3,fillColor:kindColor[a.kind]||'#aa736c',fillOpacity:1}).addTo(mapInstance).bindPopup(`<b>${escapeHTML(a.name)}</b><br>${escapeHTML(categoryLabels[a.kind]||'Visite')}<br>${escapeHTML(days[a.day][0])} · ${escapeHTML(a.time)}<br><a href="${mapsLink(locText(a))}" target="_blank">Ouvrir dans Google Maps ↗</a>`);bounds.push(coords[k])}if(state.mapDay!=='all'&&state.mapKind==='all'){let seq=activities.filter(a=>a.day===Number(state.mapDay)&&coords[a.loc]).map(a=>coords[a.loc]);if(seq.length>1)L.polyline(seq,{color:'#ac736c',weight:3,dashArray:'5,8',opacity:.7}).addTo(mapInstance)}if(bounds.length>1)mapInstance.fitBounds(bounds,{padding:[25,25],maxZoom:13});setTimeout(()=>mapInstance?.invalidateSize(),160)}catch(e){$('#map').innerHTML='<div class="mapfallback">Impossible de charger la carte. Utilise les liens Google Maps.</div>'}}
function dailySpent(i){return state.expenses.filter(e=>Number(e.day)===i&&e.day!==''&&e.day!==null&&e.day!==undefined).reduce((n,e)=>n+(Number(e.eur)||0),0)}
function renderBudget(){const total=spent(), estimates=(Array.isArray(state.dailyEstimates)?state.dailyEstimates:[0,0,0,0,0,0]);const estimatedTotal=estimates.reduce((n,v)=>n+(Number(v)||0),0);
$('#view-budget').innerHTML=`<h2 class="section-title">Budget commun</h2><div class="hero"><span class="eyebrow">Suivi des dépenses</span><p class="budgetbig">${euros(state.budget-total)}</p><div class="small muted">Reste sur le budget de référence (hors dépenses non saisies)</div><div class="stats"><div class="stat"><b>${euros(state.budget)}</b><span>Budget global</span></div><div class="stat"><b>${euros(estimatedTotal)}</b><span>Prévu par jour*</span></div><div class="stat"><b>${euros(total)}</b><span>Réel saisi</span></div></div></div><div class="warning">Les 793 € initiaux (vol 160 €, transport 120 €, hébergement 513 €) sont une référence, pas des dépenses enregistrées. Une autre note indique 330 € pour vol + transport, soit un écart de 50 € à clarifier. *Les estimations journalières sont séparées du budget global : ne pas additionner automatiquement ces montants.</div><div class="card"><label class="field" for="budget-limit">Budget global de référence (€)</label><input class="input" id="budget-limit" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" value="${Number(state.budget)||0}"><div class="btnrow">${btn('Enregistrer le budget global','save-budget')}</div></div><div class="card"><h3>Prévu et dépensé par journée</h3><p class="small muted">Renseigne un montant estimé pour chaque jour puis ajoute tes dépenses réelles plus bas. Tu peux laisser 0 € si tu n'as pas d'estimation.</p>${days.map((d,i)=>`<div class="dailybudget"><div><b>${escapeHTML(d[0])} octobre</b><div class="small muted">Réel saisi : <strong>${euros(dailySpent(i))}</strong> · Écart (prévu − réel) : <strong>${euros((Number(estimates[i])||0)-dailySpent(i))}</strong></div></div><label class="small">Prévision (€)<input class="input day-estimate" type="number" min="0" max="100000" step="0.01" inputmode="decimal" data-estimate="${i}" value="${Number(estimates[i])||0}" aria-label="Budget estimé du ${escapeHTML(d[0])}"></label></div>`).join('')}<div class="btnrow">${btn('Enregistrer les 6 estimations','save-estimates','primary')}</div></div><div class="card"><h3>Ajouter une dépense réelle</h3><form id="expense-form"><label class="field" for="exp-name">Description</label><input class="input" id="exp-name" maxlength="100" required placeholder="Ex. déjeuner Camden"><div class="grid2"><label><span class="field">Journée</span><select class="input" id="exp-day" required>${days.map((d,i)=>`<option value="${i}" ${i===state.selectedDay?'selected':''}>${escapeHTML(d[0])} octobre</option>`).join('')}<option value="none">Hors journée (vol, logement…)</option></select></label><label><span class="field">Catégorie</span><select class="input" id="exp-category"><option>Restaurants</option><option>Transports</option><option>Activités</option><option>Musées</option><option>Hébergement</option><option>Shopping</option><option>Autre</option></select></label></div><div class="grid2"><label><span class="field">Montant</span><input class="input" id="exp-amount" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" required></label><label><span class="field">Devise</span><select class="input" id="exp-currency"><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select></label></div><label><span class="field">Si £ : taux personnel (1 £ = ... €)</span><input class="input" id="exp-rate" type="number" min="0.01" max="5" step="0.0001" value="1.17"><span class="small muted">Taux indicatif à ajuster, non actualisé automatiquement.</span></label><div class="btnrow"><button class="btn primary" type="submit">+ Enregistrer la dépense</button></div></form></div><div class="card"><h3>Dépenses enregistrées</h3>${state.expenses.length?state.expenses.slice().reverse().map(e=>`<div class="expense"><div><b>${escapeHTML(e.name)}</b><div class="small muted">${escapeHTML(e.category)} · ${e.day!==undefined&&e.day!==null&&e.day!==''&&Number.isInteger(Number(e.day))&&Number(e.day)>=0&&Number(e.day)<6?escapeHTML(days[Number(e.day)][0])+' octobre':'Non attribuée'} · ${escapeHTML(e.currency)} ${Number(e.amount).toFixed(2)} ${e.currency==='GBP'?'· taux '+Number(e.rate).toFixed(4):''}</div></div><div style="text-align:right"><b>${euros(e.eur)}</b><br><button class="btn" style="padding:4px 9px;min-height:30px;font-size:11px" data-delete="${escapeHTML(e.id)}">Supprimer</button></div></div>`).join(''):'<p class="muted small">Aucune dépense enregistrée.</p>'}</div>`}
function render(){renderHome();renderPlanning();renderBudget();if(state.tab==='map')renderMap();for(const tab of ['home','planning','map','budget'])$('#view-'+tab).classList.toggle('hide',state.tab!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function switchTab(tab){state.tab=tab;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}const day=e.target.closest('[data-day]');if(day){state.selectedDay=Number(day.dataset.day);save();renderPlanning();return}const goto=e.target.closest('[data-goto-day]');if(goto){state.selectedDay=Number(goto.dataset.gotoDay);save();switchTab('planning');return}const del=e.target.closest('[data-delete]');if(del){if(confirm('Supprimer cette dépense ?')){state.expenses=state.expenses.filter(x=>x.id!==del.dataset.delete);save();render()}return}const action=e.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='save-budget'){const n=Number($('#budget-limit').value);if(!Number.isFinite(n)||n<0||n>1e6){alert('Entre un budget valide.');return}state.budget=n;save();render()}if(action.dataset.action==='save-estimates'){const estimates=[...document.querySelectorAll('[data-estimate]')].map(x=>Number(x.value));if(estimates.length!==6||estimates.some(x=>!Number.isFinite(x)||x<0||x>100000)){alert('Vérifie les six budgets estimés.');return}state.dailyEstimates=estimates;save();renderBudget();return}if(action.dataset.action==='export'){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='londres-2026-sauvegarde.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(action.dataset.action==='import')$('#backup-file').click()});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){state.checked[e.target.dataset.check]=e.target.checked;save();renderPlanning();renderHome();return}if(e.target.id==='map-day'||e.target.id==='map-kind'){state.mapDay=$('#map-day').value;state.mapKind=$('#map-kind').value;save();renderMap();return}if(e.target.id==='backup-file'&&e.target.files[0]){const file=e.target.files[0];if(file.size>2000000){alert('Fichier trop volumineux.');return}file.text().then(raw=>{let data=JSON.parse(raw);if(data.version!==1||!data.state||typeof data.state!=='object'||!Array.isArray(data.state.expenses)||typeof data.state.checked!=='object'||data.state.checked===null)throw Error('Format non reconnu');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state={...state,checked:data.state.checked,expenses:data.state.expenses.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(Number(x.eur))).slice(0,1000),budget:Math.max(0,Math.min(1000000,Number(data.state.budget)||0)),dailyEstimates:Array.isArray(data.state.dailyEstimates)?Array.from({length:6},(_,i)=>Math.max(0,Math.min(100000,Number(data.state.dailyEstimates[i])||0))):[0,0,0,0,0,0],selectedDay:Math.max(0,Math.min(5,Number(data.state.selectedDay)||0)),mapDay:'all',mapKind:'all',tab:'home'};save();render();alert('Sauvegarde importée !')}).catch(err=>alert('Import impossible : '+err.message));e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id!=='expense-form')return;e.preventDefault();let name=$('#exp-name').value.trim(),amount=Number($('#exp-amount').value),currency=$('#exp-currency').value,rate=currency==='GBP'?Number($('#exp-rate').value):1;if(!name||!Number.isFinite(amount)||amount<=0||amount>100000||!Number.isFinite(rate)||rate<=0||rate>5){alert('Vérifie la description, le montant et le taux.');return}state.expenses.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name.slice(0,100),amount,currency,rate,eur:Math.round(amount*rate*100)/100,category:$('#exp-category').value,day:$('#exp-day').value==='none'?null:Number($('#exp-day').value)});save();renderBudget();renderHome()});render();
</script></body></html>
