const dayPanels=days.map((d,i)=>{const expected=BUDGET_KINDS.reduce((n,k)=>n+grid[i][k.key],0),actual=dailySpent(i);return `<section class="day-budget-panel"><div class="day-budget-title"><div><span class="eyebrow">JOUR ${i+1}</span><h4>${escapeHTML(d[0])} ${escapeHTML(d[1])}</h4></div><div class="small" style="text-align:right">Prévu <b>${euros(expected)}</b><br>Réel <b>${euros(actual)}</b><br><span class="${actual>expected?'budget-over':''}">Écart ${euros(expected-actual)}</span></div></div><div class="budget-columns"><span>Catégorie</span><span>Prévu (€)</span><span>Dépensé</span></div>${BUDGET_KINDS.map(k=>`<div class="budget-category-row"><label for="estimate-${i}-${k.key}"><strong>${k.label}</strong><small>${k.desc}</small></label><input class="input category-estimate" id="estimate-${i}-${k.key}" data-estimate-day="${i}" data-estimate-kind="${k.key}" type="number" min="0" max="100000" step="0.01" inputmode="decimal" value="${grid[i][k.key]}" aria-label="Prévision ${k.label} ${escapeHTML(d[0])}"><strong class="budget-actual">${euros(dayActual(i,k.key))}</strong></div>`).join('')}</section>`}).join('');
$('#view-budget').innerHTML=`<h2 class="section-title">Budget commun</h2><div class="hero"><span class="eyebrow">Suivi du séjour</span><p class="budgetbig">${euros(state.budget-total)}</p><div class="small muted">Reste sur le budget global, selon les dépenses enregistrées</div><div class="stats"><div class="stat"><b>${euros(state.budget)}</b><span>Référence globale</span></div><div class="stat"><b>${euros(estimatedTotal)}</b><span>Prévu pour 6 jours</span></div><div class="stat"><b>${euros(total)}</b><span>Dépensé au total</span></div></div></div><div class="warning">Ton budget initial de 793 € (vol 160 €, transport 120 €, hébergement 513 €) est une référence, pas un paiement déjà comptabilisé. Ta note « vol + transport = 330 € » présente un écart de 50 €. Les prévisions quotidiennes ne s'ajoutent pas automatiquement au budget global et ne sont jamais comptées comme dépensées.</div><div class="card"><label class="field" for="budget-limit">Budget global de référence (€)</label><input class="input" id="budget-limit" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" value="${Number(state.budget)||0}"><div class="btnrow">${btn('Enregistrer le budget global','save-budget')}</div></div><div class="card"><h3>Prévisions et dépenses par jour</h3><p class="small muted">Renseigne tes prévisions en euros. Les montants réels sont calculés automatiquement depuis les dépenses saisies plus bas. « Extras » comprend activités, musées, shopping et autres.</p>${dayPanels}<div class="btnrow">${btn('Enregistrer les prévisions des 6 jours','save-estimates','primary')}</div></div><div class="card"><h3>+ Ajouter une dépense réelle</h3><form id="expense-form"><label class="field" for="exp-name">Description</label><input class="input" id="exp-name" maxlength="100" required placeholder="Ex. déjeuner Camden"><div class="grid2"><label><span class="field">Journée</span><select class="input" id="exp-day" required>${days.map((d,i)=>`<option value="${i}" ${i===state.selectedDay?'selected':''}>${escapeHTML(d[0])} octobre</option>`).join('')}<option value="none">Hors journée (vol, logement…)</option></select></label><label><span class="field">Catégorie</span><select class="input" id="exp-category"><option value="Restaurants">🍽️ Nourriture</option><option value="Transports">🚇 Transport</option><option value="Activités">🎟️ Extras — activités / visites</option><option value="Musées">🎟️ Extras — musées</option><option value="Shopping">🎟️ Extras — shopping</option><option value="Autre">🎟️ Extras — autres</option><option value="Hébergement">🏠 Hébergement (hors journée)</option></select></label></div><div class="grid2"><label><span class="field">Montant</span><input class="input" id="exp-amount" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" required></label><label><span class="field">Devise</span><select class="input" id="exp-currency"><option value="EUR">EUR €</option><option value="GBP">GBP £</option></select></label></div><label><span class="field">Si £ : conversion (1 £ = … €)</span><input class="input" id="exp-rate" type="number" min="0.01" max="5" step="0.0001" value="1.17"><span class="small muted">Taux indicatif modifiable, pas de mise à jour automatique.</span></label><div class="btnrow"><button class="btn primary" type="submit">+ Enregistrer la dépense</button></div></form></div><div class="card"><h3>Dépenses enregistrées</h3>${state.expenses.length?state.expenses.slice().reverse().map(e=>`<div class="expense"><div><b>${escapeHTML(e.name)}</b><div class="small muted">${escapeHTML(e.category)} · ${e.day!==undefined&&e.day!==null&&e.day!==''&&Number.isInteger(Number(e.day))&&Number(e.day)>=0&&Number(e.day)<6?escapeHTML(days[Number(e.day)][0])+' octobre':'Non attribuée'} · ${escapeHTML(e.currency)} ${Number(e.amount).toFixed(2)} ${e.currency==='GBP'?'· taux '+Number(e.rate).toFixed(4):''}</div></div><div style="text-align:right"><b>${euros(e.eur)}</b><br><button class="btn" style="padding:4px 9px;min-height:30px;font-size:11px" data-delete="${escapeHTML(e.id)}">Supprimer</button></div></div>`).join(''):'<p class="muted small">Aucune dépense enregistrée.</p>'}</div>`}
function render(){renderHome();renderPlanning();renderBudget();if(state.tab==='map')renderMap();for(const tab of ['home','planning','map','budget'])$('#view-'+tab).classList.toggle('hide',state.tab!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function switchTab(tab){state.tab=tab;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}const day=e.target.closest('[data-day]');if(day){state.selectedDay=Number(day.dataset.day);save();renderPlanning();return}const goBudget=e.target.closest('[data-goto-budget]');if(goBudget){state.selectedDay=Number(goBudget.dataset.gotoBudget);save();switchTab('budget');return}const goto=e.target.closest('[data-goto-day]');if(goto){state.selectedDay=Number(goto.dataset.gotoDay);save();switchTab('planning');return}const del=e.target.closest('[data-delete]');if(del){if(confirm('Supprimer cette dépense ?')){state.expenses=state.expenses.filter(x=>x.id!==del.dataset.delete);save();render()}return}const onMap=e.target.closest('[data-next-on-map]');if(onMap){const a=activities.find(x=>x.id===onMap.dataset.nextOnMap);if(a){state.mapDay=String(a.day);state.mapKind='all';mapNextIndex=Math.max(0,[...new Set(activities.filter(x=>x.day===a.day&&coords[x.loc]).map(x=>x.loc))].indexOf(a.loc));save();switchTab('map');if(mapInstance&&coords[a.loc])mapInstance.setView(coords[a.loc],15)}return}const quick=e.target.closest('[data-quick-expense]');if(quick){switchTab('budget');setTimeout(()=>$('#exp-name')?.scrollIntoView({behavior:'smooth',block:'center'}),50);return}const mn=e.target.closest('[data-map-next]');if(mn){let d=state.mapDay==='all'?currentStep().day:Number(state.mapDay);if(state.mapDay==='all'){state.mapDay=String(d);state.mapKind='all';mapNextIndex=0;save();renderMap()}const all=[...new Set(activities.filter(x=>x.day===d&&coords[x.loc]).map(x=>x.loc))];if(all.length){const key=all[mapNextIndex%all.length];mapNextIndex++;mapInstance?.setView(coords[key],15);const matching=activities.find(x=>x.day===d&&x.loc===key);if(matching){const tip=L.popup().setLatLng(coords[key]).setContent(`<b>Étape ${((mapNextIndex-1)%all.length)+1}</b><br>${escapeHTML(matching.name)}<br><a href="${goThere(locText(matching))}" target="_blank" rel="noopener">Y aller ↗</a>`);tip.openOn(mapInstance)}}return}const action=e.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='save-budget'){const n=Number($('#budget-limit').value);if(!Number.isFinite(n)||n<0||n>1e6){alert('Entre un budget valide.');return}state.budget=n;save();render()}if(action.dataset.action==='save-estimates'){const inputs=[...document.querySelectorAll('[data-estimate-day]')];if(inputs.length!==18){alert('Les 18 prévisions sont nécessaires.');return}const grid=Array.from({length:6},()=>({transport:0,food:0,extras:0}));for(const inp of inputs){const n=Number(inp.value);if(!Number.isFinite(n)||n<0||n>100000||inp.value.trim()===''){alert('Vérifie les prévisions : chaque montant doit être positif ou égal à zéro.');return}grid[Number(inp.dataset.estimateDay)][inp.dataset.estimateKind]=n}state.categoryEstimates=grid;state.dailyEstimates=grid.map(row=>row.transport+row.food+row.extras);save();renderBudget();return}if(action.dataset.action==='export'){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='londres-2026-sauvegarde.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(action.dataset.action==='import')$('#backup-file').click()});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){state.checked[e.target.dataset.check]=e.target.checked;save();renderPlanning();renderHome();return}if(e.target.id==='map-day'||e.target.id==='map-kind'){state.mapDay=$('#map-day').value;state.mapKind=$('#map-kind').value;mapNextIndex=0;save();renderMap();return}if(e.target.id==='backup-file'&&e.target.files[0]){const file=e.target.files[0];if(file.size>2000000){alert('Fichier trop volumineux.');return}file.text().then(raw=>{let data=JSON.parse(raw);if(data.version!==1||!data.state||typeof data.state!=='object'||!Array.isArray(data.state.expenses)||typeof data.state.checked!=='object'||data.state.checked===null)throw Error('Format non reconnu');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state={...state,checked:data.state.checked,expenses:data.state.expenses.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(Number(x.eur))).slice(0,1000),budget:Math.max(0,Math.min(1000000,Number(data.state.budget)||0)),dailyEstimates:Array.isArray(data.state.dailyEstimates)?Array.from({length:6},(_,i)=>Math.max(0,Math.min(100000,Number(data.state.dailyEstimates[i])||0))):[0,0,0,0,0,0],categoryEstimates:Array.isArray(data.state.categoryEstimates)&&data.state.categoryEstimates.length===6?data.state.categoryEstimates.map(row=>({transport:Math.max(0,Math.min(100000,Number(row?.transport)||0)),food:Math.max(0,Math.min(100000,Number(row?.food)||0)),extras:Math.max(0,Math.min(100000,Number(row?.extras)||0))})):null,selectedDay:Math.max(0,Math.min(5,Number(data.state.selectedDay)||0)),mapDay:'all',mapKind:'all',tab:'home'};save();render();alert('Sauvegarde importée !')}).catch(err=>alert('Import impossible : '+err.message));e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id!=='expense-form')return;e.preventDefault();let name=$('#exp-name').value.trim(),amount=Number($('#exp-amount').value),currency=$('#exp-currency').value,rate=currency==='GBP'?Number($('#exp-rate').value):1;if(!name||!Number.isFinite(amount)||amount<=0||amount>100000||!Number.isFinite(rate)||rate<=0||rate>5){alert('Vérifie la description, le montant et le taux.');return}state.expenses.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:name.slice(0,100),amount,currency,rate,eur:Math.round(amount*rate*100)/100,category:$('#exp-category').value,day:$('#exp-day').value==='none'?null:Number($('#exp-day').value)});save();renderBudget();renderHome()});render();
</script></body></html>
